name: Bug report
description: Report reproducible package behavior
title: "[bug] "
labels: [bug]
body:
  - type: input
    id: package
    attributes: { label: Package and version }
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes: { label: Minimal reproduction, description: Do not attach confidential documents. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected and actual behavior }
    validations: { required: true }
  - type: input
    id: environment
    attributes: { label: Node, OS, and package manager }
    validations: { required: true }
